<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicação de Cliente - JR Telecom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 51, 153, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0033cc 0%, #003399 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            opacity: 0.95;
        }

        .form-content {
            padding: 25px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            background: #0033cc;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            color: white;
            margin-bottom: 15px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 13px;
        }

        .required {
            color: #ff4444;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0033cc;
            box-shadow: 0 0 0 3px rgba(0, 51, 204, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0033cc 0%, #003399 100%);
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(0, 51, 153, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
            font-size: 13px;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #f5c6cb;
            font-size: 13px;
        }

        .error-message.show {
            display: block;
        }

        .loading-message {
            display: none;
            background: #d1ecf1;
            color: #0c5460;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #17a2b8;
            font-size: 13px;
        }

        .loading-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .plano-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .plano-card input[type="radio"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
        }

        .plano-card:hover {
            border-color: #0033cc;
            background: #f8faff;
        }

        .plano-velocidade {
            font-weight: 700;
            color: #0033cc;
            font-size: 16px;
            margin-bottom: 2px;
        }

        .plano-detalhes {
            font-size: 12px;
            color: #666;
        }

        .adicionais-group {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .adicionais-label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
            font-size: 13px;
        }

        .adicional-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .adicional-card:hover {
            background: #f8faff;
            border-color: #0033cc;
        }

        .adicional-card input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .adicional-card label {
            margin: 0;
            cursor: pointer;
            flex: 1;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .day-button {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            color: #333;
            transition: all 0.3s;
            font-size: 13px;
        }

        .day-button:hover {
            border-color: #0033cc;
            background: #f8faff;
        }

        .day-button.selected {
            background: #0033cc;
            color: white;
            border-color: #0033cc;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: block;
            padding: 10px;
            background: #f8faff;
            border: 2px dashed #0033cc;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #0033cc;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #e3f2fd;
        }

        .file-name {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .preview-foto {
            width: 100%;
            max-height: 150px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📱 Indicações JR Telecom</h1>
    </div>

    <div class="form-content">
        <div id="successMsg" class="success-message">✅ Indicação enviada com sucesso!</div>
        <div id="errorMsg" class="error-message">❌ Erro ao enviar indicação</div>
        <div id="loadingMsg" class="loading-message">⏳ Enviando indicação...</div>

        <form id="formAdesao">
            <!-- FILIAL -->
            <div class="section">
                <div class="section-title">🏢 Sua Filial</div>
                <div class="form-group">
                    <label for="filial">De qual filial você é? <span class="required">*</span></label>
                    <select id="filial" name="filial" required>
                        <option value="">-- Selecione sua filial --</option>
                        <option value="Petrolina">Petrolina</option>
                        <option value="Dormentes">Dormentes</option>
                        <option value="Juazeiro">Juazeiro</option>
                        <option value="Pilar">Pilar</option>
                        <option value="Jaguarari">Jaguarari</option>
                        <option value="Camaçari">Camaçari</option>
                        <option value="Campo Alegre de Lourdes">Campo Alegre de Lourdes</option>
                        <option value="Casa Nova">Casa Nova</option>
                        <option value="Remanso">Remanso</option>
                        <option value="Santana">Santana</option>
                        <option value="São Raimundo Nonato">São Raimundo Nonato</option>
                        <option value="Sobradinho">Sobradinho</option>
                    </select>
                </div>
            </div>

            <!-- INDICADOR -->
            <div class="section">
                <div class="section-title">👤 Seus Dados</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nomeIndicador">Seu Nome <span class="required">*</span></label>
                        <input type="text" id="nomeIndicador" name="nomeIndicador" required>
                    </div>
                    <div class="form-group">
                        <label for="telefoneIndicador">Seu Telefone <span class="required">*</span></label>
                        <input type="tel" id="telefoneIndicador" name="telefoneIndicador" required>
                    </div>
                </div>
            </div>

            <!-- CLIENTE -->
            <div class="section">
                <div class="section-title">🔗 Dados do Cliente</div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="nomeCliente">Nome / Razão Social <span class="required">*</span></label>
                        <input type="text" id="nomeCliente" name="nomeCliente" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF / CNPJ <span class="required">*</span></label>
                        <input type="text" id="cpf" name="cpf" required>
                    </div>
                    <div class="form-group">
                        <label for="telefoneCelular">Telefone do Cliente <span class="required">*</span></label>
                        <input type="tel" id="telefoneCelular" name="telefoneCelular" required>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="emailCliente">E-mail <span class="required">*</span></label>
                        <input type="email" id="emailCliente" name="emailCliente" required>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="endereco">Endereço <span class="required">*</span></label>
                        <input type="text" id="endereco" name="endereco" placeholder="Rua/Avenida, número" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="bairro">Bairro <span class="required">*</span></label>
                        <input type="text" id="bairro" name="bairro" required>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade do Cliente <span class="required">*</span></label>
                        <select id="cidade" name="cidade" required>
                            <option value="">-- Selecione a cidade --</option>
                            <option value="Petrolina">Petrolina</option>
                            <option value="Dormentes">Dormentes</option>
                            <option value="Juazeiro">Juazeiro</option>
                            <option value="Pilar">Pilar</option>
                            <option value="Jaguarari">Jaguarari</option>
                            <option value="Camaçari">Camaçari</option>
                            <option value="Campo Alegre de Lourdes">Campo Alegre de Lourdes</option>
                            <option value="Casa Nova">Casa Nova</option>
                            <option value="Remanso">Remanso</option>
                            <option value="Santana">Santana</option>
                            <option value="São Raimundo Nonato">São Raimundo Nonato</option>
                            <option value="Sobradinho">Sobradinho</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- PLANO -->
            <div class="section">
                <div class="section-title">⚡ Plano Desejado</div>
                <label style="margin-bottom: 12px;">Selecione um plano <span class="required">*</span></label>
                
                <div class="plano-card">
                    <input type="radio" id="plano500" name="plano" value="500 Mega - R$ 79,90" required>
                    <label for="plano500" style="cursor: pointer; margin: 0; flex: 1;">
                        <div class="plano-velocidade">500 Mega - R$ 79,90</div>
                        <div class="plano-detalhes">Download até 500Mbps • Upload até 250Mbps</div>
                    </label>
                </div>

                <div class="plano-card">
                    <input type="radio" id="plano600" name="plano" value="600 Mega - R$ 89,90" required>
                    <label for="plano600" style="cursor: pointer; margin: 0; flex: 1;">
                        <div class="plano-velocidade">600 Mega - R$ 89,90</div>
                        <div class="plano-detalhes">Download até 600Mbps • Upload até 300Mbps</div>
                    </label>
                </div>

                <div class="plano-card">
                    <input type="radio" id="plano800" name="plano" value="800 Mega - R$ 99,90" required>
                    <label for="plano800" style="cursor: pointer; margin: 0; flex: 1;">
                        <div class="plano-velocidade">800 Mega - R$ 99,90</div>
                        <div class="plano-detalhes">Download até 800Mbps • Upload até 400Mbps</div>
                    </label>
                </div>

                <div class="plano-card">
                    <input type="radio" id="plano1giga" name="plano" value="1 Giga - R$ 159,90" required>
                    <label for="plano1giga" style="cursor: pointer; margin: 0; flex: 1;">
                        <div class="plano-velocidade">1 Giga - R$ 159,90</div>
                        <div class="plano-detalhes">Download até 1000Mbps • Upload até 500Mbps</div>
                    </label>
                </div>

                <!-- ADICIONAIS -->
                <div class="adicionais-group">
                    <span class="adicionais-label">Adicionar ao combo (opcional)</span>
                    
                    <div class="adicional-card">
                        <input type="checkbox" id="telefoniaFixa" name="telefoniaFixa" value="Telefonia Fixa - R$ 9,90/mês">
                        <label for="telefoniaFixa">📞 Telefonia Fixa - R$ 9,90/mês</label>
                    </div>

                    <div class="adicional-card">
                        <input type="checkbox" id="wifiPlus" name="wifiPlus" value="Wi-Fi Plus - R$ 21,90/mês">
                        <label for="wifiPlus">📡 Wi-Fi Plus - R$ 21,90/mês</label>
                    </div>
                </div>
            </div>

            <!-- VENCIMENTO -->
            <div class="section">
                <div class="section-title">📅 Vencimento</div>
                <div class="form-group">
                    <label>Dia do vencimento <span class="required">*</span></label>
                    <div class="days-grid" id="daysGrid"></div>
                    <input type="hidden" id="dataVencimento" name="dataVencimento" required>
                </div>
            </div>

            <!-- FOTOS -->
            <div class="section">
                <div class="section-title">📸 Foto do Cliente (Opcional)</div>
                <div class="form-group">
                    <label for="fotoCliente">Selecione uma foto</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="fotoCliente" name="fotoCliente" accept="image/*">
                        <label for="fotoCliente" class="file-input-label">
                            📷 Clique para selecionar foto
                        </label>
                        <div class="file-name" id="fileName"></div>
                        <img id="previewFoto" class="preview-foto" alt="Preview da foto">
                    </div>
                </div>
            </div>

            <!-- OBSERVAÇÕES -->
            <div class="section">
                <div class="section-title">📝 Observações</div>
                <div class="form-group">
                    <label for="observacoes">Informações adicionais (opcional)</label>
                    <textarea id="observacoes" name="observacoes" placeholder="Adicione informações extras sobre o cliente..."></textarea>
                </div>
            </div>

            <!-- BOTÕES -->
            <div class="button-group">
                <button type="reset" class="btn-reset">Limpar</button>
                <button type="submit" class="btn-submit" id="submitBtn">Enviar Indicação</button>
            </div>

        </form>
    </div>
</div>

<script>
    // Gerar dias de 1 a 30
    const daysGrid = document.getElementById('daysGrid');
    const dataVencimento = document.getElementById('dataVencimento');

    for (let i = 1; i <= 30; i++) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'day-button';
        button.textContent = String(i).padStart(2, '0');
        button.dataset.day = i;
        
        button.addEventListener('click', (e) => {
            e.preventDefault();
            
            document.querySelectorAll('.day-button').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            button.classList.add('selected');
            dataVencimento.value = String(i).padStart(2, '0');
        });
        
        daysGrid.appendChild(button);
    }

    // Prévia de foto
    const fotoInput = document.getElementById('fotoCliente');
    const fileName = document.getElementById('fileName');
    const previewFoto = document.getElementById('previewFoto');

    fotoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            fileName.textContent = '✅ ' + file.name;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                previewFoto.src = event.target.result;
                previewFoto.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // URL do Google Apps Script v2.3
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVAtq9dap0Av4RCCNhmR2n0Odnhe2M_siN9nrD8J69bnd9MrQLfm0SlZpQTbpa_OXQhQ/exec';

    // Submit do formulário
    document.getElementById('formAdesao').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const loadingMsg = document.getElementById('loadingMsg');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const submitBtn = document.getElementById('submitBtn');
        
        // Limpar mensagens anteriores
        loadingMsg.classList.remove('show');
        errorMsg.classList.remove('show');
        successMsg.classList.remove('show');
        
        // Validar vencimento
        if (!dataVencimento.value) {
            errorMsg.textContent = '❌ Por favor, selecione um dia de vencimento.';
            errorMsg.classList.add('show');
            return;
        }
        
        // Mostrar mensagem de carregamento
        loadingMsg.classList.add('show');
        submitBtn.disabled = true;
        
        try {
            // Adiciona adicionais selecionados
            const adicionais = [];
            if (document.getElementById('telefoniaFixa').checked) {
                adicionais.push(document.getElementById('telefoniaFixa').value);
            }
            if (document.getElementById('wifiPlus').checked) {
                adicionais.push(document.getElementById('wifiPlus').value);
            }
            
            // Processar foto se houver
            let fotoBase64 = '';
            if (fotoInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = async function() {
                    fotoBase64 = reader.result;
                    enviarFormulario(adicionais, fotoBase64);
                };
                reader.readAsDataURL(fotoInput.files[0]);
            } else {
                enviarFormulario(adicionais, '');
            }

            async function enviarFormulario(adicionais, fotoBase64) {
                const payload = {
                    dataEnvio: new Date().toLocaleString('pt-BR'),
                    filial: document.getElementById('filial').value,
                    nomeIndicador: document.getElementById('nomeIndicador').value,
                    telefoneIndicador: document.getElementById('telefoneIndicador').value,
                    nomeCliente: document.getElementById('nomeCliente').value,
                    cpf: document.getElementById('cpf').value,
                    telefoneCelular: document.getElementById('telefoneCelular').value,
                    emailCliente: document.getElementById('emailCliente').value,
                    endereco: document.getElementById('endereco').value,
                    bairro: document.getElementById('bairro').value,
                    cidade: document.getElementById('cidade').value,
                    plano: document.querySelector('input[name="plano"]:checked').value,
                    adicionais: adicionais.length > 0 ? adicionais.join(' | ') : 'Nenhum',
                    dataVencimento: document.getElementById('dataVencimento').value,
                    observacoes: document.getElementById('observacoes').value,
                    fotoCliente: fotoBase64
                };
                
                console.log('Enviando para Apps Script - Cidade: ' + payload.cidade);
                
                // Enviar para Apps Script
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    loadingMsg.classList.remove('show');
                    successMsg.textContent = `✅ Indicação de ${payload.nomeCliente} enviada com sucesso para ${result.aba}!`;
                    successMsg.classList.add('show');
                    document.getElementById('formAdesao').reset();
                    
                    // Remove seleção de dias
                    document.querySelectorAll('.day-button').forEach(btn => {
                        btn.classList.remove('selected');
                    });
                    dataVencimento.value = '';
                    previewFoto.style.display = 'none';
                    fileName.textContent = '';
                    
                    setTimeout(() => {
                        successMsg.classList.remove('show');
                        submitBtn.disabled = false;
                    }, 3000);
                } else {
                    throw new Error(result.error || 'Erro ao enviar');
                }
            }
            
        } catch (erro) {
            loadingMsg.classList.remove('show');
            errorMsg.textContent = '❌ Erro ao enviar indicação. Tente novamente: ' + erro.message;
            errorMsg.classList.add('show');
            submitBtn.disabled = false;
            console.error('Erro:', erro);
        }
    });

    console.log('✅ Formulário de Indicações JR Telecom v2.3 COMPLETO ativado');
</script>

</body>
</html>
