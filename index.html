<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicação de Cliente - JR Telecom</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background: #f5f5f5; padding: 20px; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 51, 153, 0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #0033cc 0%, #003399 100%); color: white; padding: 30px 20px; text-align: center; }
        .header h1 { font-size: 24px; margin-bottom: 5px; font-weight: 700; }
        .form-content { padding: 25px; }
        .section { margin-bottom: 25px; }
        .section-title { background: #0033cc; padding: 10px 15px; border-radius: 6px; font-weight: 600; color: white; margin-bottom: 15px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-row.full { grid-template-columns: 1fr; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; font-size: 13px; }
        .required { color: #ff4444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; transition: all 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #0033cc; box-shadow: 0 0 0 3px rgba(0, 51, 204, 0.1); }
        textarea { resize: vertical; min-height: 80px; }
        .button-group { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; }
        button { padding: 12px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-submit { background: linear-gradient(135deg, #0033cc 0%, #003399 100%); color: white; }
        .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 16px rgba(0, 51, 153, 0.3); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-reset { background: #f0f0f0; color: #333; border: 1px solid #ddd; }
        .btn-reset:hover { background: #e0e0e0; }
        .success-message { display: none; background: #d4edda; color: #155724; padding: 12px; border-radius: 6px; margin-bottom: 20px; border-left: 4px solid #28a745; font-size: 13px; }
        .success-message.show { display: block; animation: slideDown 0.3s ease-out; }
        .error-message { display: none; background: #f8d7da; color: #721c24; padding: 12px; border-radius: 6px; margin-bottom: 20px; border-left: 4px solid #f5c6cb; font-size: 13px; }
        .error-message.show { display: block; }
        .loading-message { display: none; background: #d1ecf1; color: #0c5460; padding: 12px; border-radius: 6px; margin-bottom: 20px; border-left: 4px solid #17a2b8; font-size: 13px; }
        .loading-message.show { display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .plano-card { border: 2px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; }
        .plano-card input[type="radio"] { margin-right: 12px; width: 20px; height: 20px; }
        .plano-card:hover { border-color: #0033cc; background: #f8faff; }
        .plano-velocidade { font-weight: 700; color: #0033cc; font-size: 16px; margin-bottom: 2px; }
        .plano-detalhes { font-size: 12px; color: #666; }
        .adicionais-group { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .adicionais-label { display: block; font-weight: 600; margin-bottom: 12px; color: #333; font-size: 13px; }
        .adicional-card { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; }
        .adicional-card:hover { background: #f8faff; border-color: #0033cc; }
        .adicional-card input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; }
        .adicional-card label { margin: 0; cursor: pointer; flex: 1; }
        .days-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
        .day-button { padding: 10px; border: 2px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-weight: 600; color: #333; transition: all 0.3s; font-size: 13px; }
        .day-button:hover { border-color: #0033cc; background: #f8faff; }
        .day-button.selected { background: #0033cc; color: white; border-color: #0033cc; }
        .file-input-wrapper { position: relative; display: inline-block; width: 100%; }
        .file-input-wrapper input[type="file"] { display: none; }
        .file-input-label { display: block; padding: 10px; background: #f8faff; border: 2px dashed #0033cc; border-radius: 6px; text-align: center; cursor: pointer; font-weight: 600; color: #0033cc; transition: all 0.3s; }
        .file-input-label:hover { background: #e3f2fd; }
        .file-name { font-size: 12px; color: #666; margin-top: 5px; }
        .preview-foto { width: 100%; max-height: 150px; border-radius: 6px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📱 Indicações JR Telecom</h1>
    </div>

    <div class="form-content">
        <div id="successMsg" class="success-message">✅ Indicação enviada com sucesso!</div>
        <div id="errorMsg" class="error-message">❌ Erro ao enviar indicação</div>
        <div id="loadingMsg" class="loading-message">⏳ Enviando indicação...</div>

        <form id="formAdesao">
            <!-- SEÇÃO 1: SUA FILIAL -->
            <div class="section">
                <div class="section-title">🏢 Sua Filial</div>
                <div class="form-group">
                    <label for="suaFilial">De qual filial você é? <span class="required">*</span></label>
                    <select id="suaFilial" required>
                        <option value="">-- Selecione sua filial --</option>
                        <option value="Petrolina">Petrolina</option>
                        <option value="Dormentes">Dormentes</option>
                        <option value="Juazeiro">Juazeiro</option>
                        <option value="Pilar">Pilar</option>
                        <option value="Jaguarari">Jaguarari</option>
                        <option value="Camaçari">Camaçari</option>
                        <option value="Campo Alegre de Lourdes">Campo Alegre de Lourdes</option>
                        <option value="Casa Nova">Casa Nova</option>
                        <option value="Remanso">Remanso</option>
                        <option value="Santana">Santana</option>
                        <option value="São Raimundo Nonato">São Raimundo Nonato</option>
                        <option value="Sobradinho">Sobradinho</option>
                    </select>
                </div>
            </div>

            <!-- SEÇÃO 2: SEUS DADOS -->
            <div class="section">
                <div class="section-title">👤 Seus Dados</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="seuNome">Seu Nome <span class="required">*</span></label>
                        <input type="text" id="seuNome" required>
                    </div>
                    <div class="form-group">
                        <label for="seuTelefone">Seu Telefone <span class="required">*</span></label>
                        <input type="tel" id="seuTelefone" required>
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 3: DADOS DO CLIENTE -->
            <div class="section">
                <div class="section-title">🔗 Dados do Cliente</div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="clienteNome">Nome / Razão Social <span class="required">*</span></label>
                        <input type="text" id="clienteNome" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="clienteCPF">CPF / CNPJ <span class="required">*</span></label>
                        <input type="text" id="clienteCPF" required>
                    </div>
                    <div class="form-group">
                        <label for="clienteTelefone">Telefone do Cliente <span class="required">*</span></label>
                        <input type="tel" id="clienteTelefone" required>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="clienteEmail">E-mail <span class="required">*</span></label>
                        <input type="email" id="clienteEmail" required>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="clienteEndereco">Endereço <span class="required">*</span></label>
                        <input type="text" id="clienteEndereco" placeholder="Rua/Avenida, número" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="clienteBairro">Bairro <span class="required">*</span></label>
                        <input type="text" id="clienteBairro" required>
                    </div>
                    <div class="form-group">
                        <label for="clienteCidade">Cidade do Cliente <span class="required">*</span></label>
                        <select id="clienteCidade" required>
                            <option value="">-- Selecione a cidade --</option>
                            <option value="Petrolina">Petrolina</option>
                            <option value="Dormentes">Dormentes</option>
                            <option value="Juazeiro">Juazeiro</option>
                            <option value="Pilar">Pilar</option>
                            <option value="Jaguarari">Jaguarari</option>
                            <option value="Camaçari">Camaçari</option>
                            <option value="Campo Alegre de Lourdes">Campo Alegre de Lourdes</option>
                            <option value="Casa Nova">Casa Nova</option>
                            <option value="Remanso">Remanso</option>
                            <option value="Santana">Santana</option>
                            <option value="São Raimundo Nonato">São Raimundo Nonato</option>
                            <option value="Sobradinho">Sobradinho</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 4: PLANO -->
            <div class="section">
                <div class="section-title">⚡ Plano Desejado</div>
                <label style="margin-bottom: 12px;">Selecione um plano <span class="required">*</span></label>
                <div class="plano-card">
                    <input type="radio" id="plano1" name="planoSelecionado" value="500 Mega - R$ 79,90" required>
                    <label for="plano1" style="cursor: pointer; margin: 0; flex: 1;"><div class="plano-velocidade">500 Mega - R$ 79,90</div><div class="plano-detalhes">Download até 500Mbps • Upload até 250Mbps</div></label>
                </div>
                <div class="plano-card">
                    <input type="radio" id="plano2" name="planoSelecionado" value="600 Mega - R$ 89,90" required>
                    <label for="plano2" style="cursor: pointer; margin: 0; flex: 1;"><div class="plano-velocidade">600 Mega - R$ 89,90</div><div class="plano-detalhes">Download até 600Mbps • Upload até 300Mbps</div></label>
                </div>
                <div class="plano-card">
                    <input type="radio" id="plano3" name="planoSelecionado" value="800 Mega - R$ 99,90" required>
                    <label for="plano3" style="cursor: pointer; margin: 0; flex: 1;"><div class="plano-velocidade">800 Mega - R$ 99,90</div><div class="plano-detalhes">Download até 800Mbps • Upload até 400Mbps</div></label>
                </div>
                <div class="plano-card">
                    <input type="radio" id="plano4" name="planoSelecionado" value="1 Giga - R$ 159,90" required>
                    <label for="plano4" style="cursor: pointer; margin: 0; flex: 1;"><div class="plano-velocidade">1 Giga - R$ 159,90</div><div class="plano-detalhes">Download até 1000Mbps • Upload até 500Mbps</div></label>
                </div>
                <div class="adicionais-group">
                    <span class="adicionais-label">Adicionar ao combo (opcional)</span>
                    <div class="adicional-card">
                        <input type="checkbox" id="adicional1" value="Telefonia Fixa - R$ 9,90/mês">
                        <label for="adicional1">📞 Telefonia Fixa - R$ 9,90/mês</label>
                    </div>
                    <div class="adicional-card">
                        <input type="checkbox" id="adicional2" value="Wi-Fi Plus - R$ 21,90/mês">
                        <label for="adicional2">📡 Wi-Fi Plus - R$ 21,90/mês</label>
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 5: VENCIMENTO -->
            <div class="section">
                <div class="section-title">📅 Vencimento</div>
                <div class="form-group">
                    <label>Dia do vencimento <span class="required">*</span></label>
                    <div class="days-grid" id="daysGrid"></div>
                    <input type="hidden" id="vencimentoDia" required>
                </div>
            </div>

            <!-- SEÇÃO 6: FOTO -->
            <div class="section">
                <div class="section-title">📸 Foto do Cliente (Opcional)</div>
                <div class="form-group">
                    <label for="fotoPNG">Selecione uma foto</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="fotoPNG" accept="image/*">
                        <label for="fotoPNG" class="file-input-label">📷 Clique para selecionar foto</label>
                        <div class="file-name" id="fotoNomearquivo"></div>
                        <img id="fotoPreview" class="preview-foto" alt="Preview">
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 7: OBSERVAÇÕES -->
            <div class="section">
                <div class="section-title">📝 Observações</div>
                <div class="form-group">
                    <label for="obsTexto">Informações adicionais (opcional)</label>
                    <textarea id="obsTexto" placeholder="Adicione informações extras..."></textarea>
                </div>
            </div>

            <div class="button-group">
                <button type="reset" class="btn-reset">Limpar</button>
                <button type="submit" class="btn-submit" id="submitBtn">Enviar Indicação</button>
            </div>
        </form>
    </div>
</div>

<script>
// ===== GRADE DE DIAS =====
const daysGrid = document.getElementById('daysGrid');
const vencimentoDia = document.getElementById('vencimentoDia');

for (let i = 1; i <= 30; i++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'day-button';
    button.textContent = String(i).padStart(2, '0');
    button.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('.day-button').forEach(btn => btn.classList.remove('selected'));
        button.classList.add('selected');
        vencimentoDia.value = String(i).padStart(2, '0');
    });
    daysGrid.appendChild(button);
}

// ===== FOTO =====
const fotoPNG = document.getElementById('fotoPNG');
const fotoNomearquivo = document.getElementById('fotoNomearquivo');
const fotoPreview = document.getElementById('fotoPreview');

fotoPNG.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        fotoNomearquivo.textContent = '✅ ' + file.name;
        const reader = new FileReader();
        reader.onload = function(event) {
            fotoPreview.src = event.target.result;
            fotoPreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
});

// ===== ENVIO =====
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVAtq9dap0Av4RCCNhmR2n0Odnhe2M_siN9nrD8J69bnd9MrQLfm0SlZpQTbpa_OXQhQ/exec';

document.getElementById('formAdesao').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const loadingMsg = document.getElementById('loadingMsg');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');
    
    loadingMsg.classList.remove('show');
    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');
    
    if (!vencimentoDia.value) {
        errorMsg.textContent = '❌ Por favor, selecione um dia de vencimento.';
        errorMsg.classList.add('show');
        return;
    }
    
    loadingMsg.classList.add('show');
    submitBtn.disabled = true;
    
    try {
        // Capturar adicionais
        const adicionaisList = [];
        if (document.getElementById('adicional1').checked) {
            adicionaisList.push(document.getElementById('adicional1').value);
        }
        if (document.getElementById('adicional2').checked) {
            adicionaisList.push(document.getElementById('adicional2').value);
        }
        
        let fotoBase64 = '';
        if (fotoPNG.files.length > 0) {
            const reader = new FileReader();
            reader.onload = async function() {
                fotoBase64 = reader.result;
                enviarDados(adicionaisList, fotoBase64);
            };
            reader.readAsDataURL(fotoPNG.files[0]);
        } else {
            enviarDados(adicionaisList, '');
        }

        async function enviarDados(adicionaisList, fotoBase64) {
            // CAPTURA EXATA DOS CAMPOS
            const suaFilialValue = document.getElementById('suaFilial').value;
            const seuNomeValue = document.getElementById('seuNome').value;
            const seuTelefoneValue = document.getElementById('seuTelefone').value;
            const clienteNomeValue = document.getElementById('clienteNome').value;
            const clienteCPFValue = document.getElementById('clienteCPF').value;
            const clienteTelefoneValue = document.getElementById('clienteTelefone').value;
            const clienteEmailValue = document.getElementById('clienteEmail').value;
            const clienteEnderecoValue = document.getElementById('clienteEndereco').value;
            const clienteBairroValue = document.getElementById('clienteBairro').value;
            const clienteCidadeValue = document.getElementById('clienteCidade').value;
            const planoValue = document.querySelector('input[name="planoSelecionado"]:checked').value;
            const vencimentoValue = document.getElementById('vencimentoDia').value;
            const obsValue = document.getElementById('obsTexto').value || 'Sem observações';

            const adicionaisStr = adicionaisList.length > 0 ? adicionaisList.join(' | ') : 'Nenhum';

            // LOG DE DEBUG
            console.log('===== ENVIANDO =====');
            console.log('Sua Filial:', suaFilialValue);
            console.log('Seu Nome:', seuNomeValue);
            console.log('Seu Telefone:', seuTelefoneValue);
            console.log('Cliente Nome:', clienteNomeValue);
            console.log('Cliente CPF:', clienteCPFValue);
            console.log('Cliente Telefone:', clienteTelefoneValue);
            console.log('Cliente Email:', clienteEmailValue);
            console.log('Cliente Endereço:', clienteEnderecoValue);
            console.log('Cliente Bairro:', clienteBairroValue);
            console.log('Cliente Cidade:', clienteCidadeValue);
            console.log('Plano:', planoValue);
            console.log('Adicionais:', adicionaisStr);
            console.log('Vencimento:', vencimentoValue);
            console.log('====================');

            // PAYLOAD FINAL
            const payload = {
                dataEnvio: new Date().toLocaleString('pt-BR'),
                unidade: suaFilialValue,
                nomeIndicador: seuNomeValue,
                telefoneIndicador: seuTelefoneValue,
                nomeCliente: clienteNomeValue,
                cpf: clienteCPFValue,
                telefoneCelular: clienteTelefoneValue,
                emailCliente: clienteEmailValue,
                endereco: clienteEnderecoValue,
                bairro: clienteBairroValue,
                cidade: clienteCidadeValue,
                plano: planoValue,
                adicionais: adicionaisStr,
                dataVencimento: vencimentoValue,
                observacoes: obsValue,
                fotoCliente: fotoBase64
            };
            
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            
            if (result.success) {
                loadingMsg.classList.remove('show');
                successMsg.textContent = `✅ Indicação de ${clienteNomeValue} enviada com sucesso para ${result.aba}!`;
                successMsg.classList.add('show');
                document.getElementById('formAdesao').reset();
                
                document.querySelectorAll('.day-button').forEach(btn => {
                    btn.classList.remove('selected');
                });
                vencimentoDia.value = '';
                fotoPreview.style.display = 'none';
                fotoNomearquivo.textContent = '';
                
                setTimeout(() => {
                    successMsg.classList.remove('show');
                    submitBtn.disabled = false;
                }, 3000);
            } else {
                throw new Error(result.error || 'Erro ao enviar');
            }
        }
        
    } catch (erro) {
        loadingMsg.classList.remove('show');
        errorMsg.textContent = '❌ Erro: ' + erro.message;
        errorMsg.classList.add('show');
        submitBtn.disabled = false;
        console.error('Erro:', erro);
    }
});

console.log('✅ Formulário v3 SEM BUGS ativado');
</script>

</body>
</html>
