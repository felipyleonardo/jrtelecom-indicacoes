<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicação de Cliente - JR Telecom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 51, 153, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0033cc 0%, #003399 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            opacity: 0.95;
        }

        .form-content {
            padding: 25px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            background: #0033cc;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            color: white;
            margin-bottom: 15px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 13px;
        }

        .required {
            color: #ff4444;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0033cc;
            box-shadow: 0 0 0 3px rgba(0, 51, 204, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0033cc 0%, #003399 100%);
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(0, 51, 153, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
            font-size: 13px;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #f5c6cb;
            font-size: 13px;
        }

        .error-message.show {
            display: block;
        }

        .loading-message {
            display: none;
            background: #d1ecf1;
            color: #0c5460;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #17a2b8;
            font-size: 13px;
        }

        .loading-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .plano-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .plano-card input[type="radio"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
        }

        .plano-card:hover {
            border-color: #0033cc;
            background: #f8faff;
        }

        .plano-velocidade {
            font-weight: 700;
            color: #0033cc;
            font-size: 16px;
            margin-bottom: 2px;
        }

        .plano-detalhes {
            font-size: 12px;
            color: #666;
        }

        .adicionais-group {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .adicionais-label {
            font-weight: 600;
            color: #333;
            font-size: 13px;
            margin-bottom: 10px;
            display: block;
        }

        .adicional-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .adicional-card input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #0033cc;
        }

        .adicional-card label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
            flex: 1;
        }

        .adicional-card:hover {
            border-color: #0033cc;
            background: #f8faff;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .day-button {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }

        .day-button:hover {
            border-color: #0033cc;
            background: #f8faff;
        }

        .day-button.selected {
            background: #0033cc;
            color: white;
            border-color: #0033cc;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .button-group {
                flex-direction: column-reverse;
            }
            button {
                width: 100%;
            }
            .header h1 {
                font-size: 20px;
            }
            .days-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎯 Indique um Cliente</h1>
        <p>Formulário interno JR TELECOM</p>
    </div>

    <div class="form-content">
        <div class="loading-message" id="loadingMsg">
            ⏳ Enviando indicação...
        </div>
        <div class="error-message" id="errorMsg"></div>
        <div class="success-message" id="successMsg">
            ✅ Indicação enviada com sucesso!
        </div>

        <form id="formAdesao">
            
            <!-- DADOS DO INDICADOR -->
            <div class="section">
                <div class="section-title">👤 Seus Dados</div>
                <div class="form-group">
                    <label for="nomeIndicador">Nome Completo <span class="required">*</span></label>
                    <input type="text" id="nomeIndicador" name="nomeIndicador" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="telefoneIndicador">Telefone <span class="required">*</span></label>
                        <input type="tel" id="telefoneIndicador" name="telefoneIndicador" required>
                    </div>
                    <div class="form-group">
                        <label for="unidade">Unidade <span class="required">*</span></label>
                        <select id="unidade" name="unidade" required>
                            <option value="">Selecione</option>
                            <option value="Juazeiro">Juazeiro</option>
                            <option value="Pilar">Pilar</option>
                            <option value="Jaguarari">Jaguarari</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- DADOS DO CLIENTE -->
            <div class="section">
                <div class="section-title">📱 Dados do Cliente</div>
                <div class="form-group">
                    <label for="nomeCliente">Nome Completo / Razão Social <span class="required">*</span></label>
                    <input type="text" id="nomeCliente" name="nomeCliente" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF / CNPJ <span class="required">*</span></label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    </div>
                    <div class="form-group">
                        <label for="telefoneCelular">Telefone <span class="required">*</span></label>
                        <input type="tel" id="telefoneCelular" name="telefoneCelular" required>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="emailCliente">E-mail <span class="required">*</span></label>
                        <input type="email" id="emailCliente" name="emailCliente" required>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="endereco">Endereço <span class="required">*</span></label>
                        <input type="text" id="endereco" name="endereco" placeholder="Rua/Avenida, número" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="bairro">Bairro <span class="required">*</span></label>
                        <input type="text" id="bairro" name="bairro" required>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade <span class="required">*</span></label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>
                </div>
            </div>

            <!-- PLANO -->
            <div class="section">
                <div class="section-title">⚡ Plano Desejado</div>
                <label style="margin-bottom: 12px;">Selecione um plano <span class="required">*</span></label>
                
                <div class="plano-card">
                    <input type="radio" id="plano500" name="plano" value="500 Mega - R$ 79,90" required>
                    <label for="plano500" style="cursor: pointer; margin: 0; flex: 1;">
                        <div class="plano-velocidade">500 Mega - R$ 79,90</div>
                        <div class="plano-detalhes">Download até 500Mbps • Upload até 250Mbps</div>
                    </label>
                </div>

                <div class="plano-card">
                    <input type="radio" id="plano600" name="plano" value="600 Mega - R$ 89,90" required>
                    <label for="plano600" style="cursor: pointer; margin: 0; flex: 1;">
                        <div class="plano-velocidade">600 Mega - R$ 89,90</div>
                        <div class="plano-detalhes">Download até 600Mbps • Upload até 300Mbps</div>
                    </label>
                </div>

                <div class="plano-card">
                    <input type="radio" id="plano800" name="plano" value="800 Mega - R$ 99,90" required>
                    <label for="plano800" style="cursor: pointer; margin: 0; flex: 1;">
                        <div class="plano-velocidade">800 Mega - R$ 99,90</div>
                        <div class="plano-detalhes">Download até 800Mbps • Upload até 400Mbps</div>
                    </label>
                </div>

                <div class="plano-card">
                    <input type="radio" id="plano1giga" name="plano" value="1 Giga - R$ 159,90" required>
                    <label for="plano1giga" style="cursor: pointer; margin: 0; flex: 1;">
                        <div class="plano-velocidade">1 Giga - R$ 159,90</div>
                        <div class="plano-detalhes">Download até 1000Mbps • Upload até 500Mbps</div>
                    </label>
                </div>

                <!-- ADICIONAIS -->
                <div class="adicionais-group">
                    <span class="adicionais-label">Adicionar ao combo (opcional)</span>
                    
                    <div class="adicional-card">
                        <input type="checkbox" id="telefoniaFixa" name="telefoniaFixa" value="Telefonia Fixa - R$ 9,90/mês">
                        <label for="telefoniaFixa">📞 Telefonia Fixa - R$ 9,90/mês</label>
                    </div>

                    <div class="adicional-card">
                        <input type="checkbox" id="wifiPlus" name="wifiPlus" value="Wi-Fi Plus - R$ 21,90/mês">
                        <label for="wifiPlus">📡 Wi-Fi Plus - R$ 21,90/mês</label>
                    </div>
                </div>
            </div>

            <!-- VENCIMENTO -->
            <div class="section">
                <div class="section-title">📅 Vencimento</div>
                <div class="form-group">
                    <label>Dia do vencimento <span class="required">*</span></label>
                    <div class="days-grid" id="daysGrid"></div>
                    <input type="hidden" id="dataVencimento" name="dataVencimento" required>
                </div>
            </div>

            <!-- BOTÕES -->
            <div class="button-group">
                <button type="reset" class="btn-reset">Limpar</button>
                <button type="submit" class="btn-submit" id="submitBtn">Enviar Indicação</button>
            </div>

        </form>
    </div>
</div>

<script>
// Gerar dias de 1 a 30
const daysGrid = document.getElementById('daysGrid');
const dataVencimento = document.getElementById('dataVencimento');

for (let i = 1; i <= 30; i++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'day-button';
    button.textContent = String(i).padStart(2, '0');
    button.dataset.day = i;
    
    button.addEventListener('click', (e) => {
        e.preventDefault();
        
        document.querySelectorAll('.day-button').forEach(btn => {
            btn.classList.remove('selected');
        });
        
        button.classList.add('selected');
        dataVencimento.value = String(i).padStart(2, '0');
    });
    
    daysGrid.appendChild(button);
}

// URL do Google Apps Script (Deploy do formulário)
// Esta URL foi gerada ao fazer o deploy do Apps Script
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyi74OmF1GpZGT6iMsLNuwujjxKCERzucOOrZA4vf9rEXJF0aX35qyhVV19KrofaFHmxg/exec';

// Função para enviar dados para Google Sheets via Apps Script
async function enviarParaPlanilha(dados) {
    try {
        // Preparar dados para envio
        const payload = {
            dataEnvio: dados.dataEnvio,
            nomeIndicador: dados.nomeIndicador,
            telefoneIndicador: dados.telefoneIndicador,
            unidade: dados.unidade,
            nomeCliente: dados.nomeCliente,
            cpf: dados.cpf,
            telefoneCelular: dados.telefoneCelular,
            emailCliente: dados.emailCliente,
            endereco: dados.endereco,
            bairro: dados.bairro,
            cidade: dados.cidade,
            plano: dados.plano,
            adicionais: dados.adicionais,
            dataVencimento: dados.dataVencimento
        };
        
        // Enviar para Apps Script
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
            mode: 'no-cors'
        });
        
        // Também salvar localmente como backup
        let indicacoes = JSON.parse(localStorage.getItem('indicacoes') || '[]');
        indicacoes.push(dados);
        localStorage.setItem('indicacoes', JSON.stringify(indicacoes));
        
        return true;
    } catch (erro) {
        console.error('Erro ao enviar:', erro);
        // Salvar localmente em caso de erro
        let indicacoes = JSON.parse(localStorage.getItem('indicacoes') || '[]');
        indicacoes.push(dados);
        localStorage.setItem('indicacoes', JSON.stringify(indicacoes));
        throw erro;
    }
}

// Submit do formulário
document.getElementById('formAdesao').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const loadingMsg = document.getElementById('loadingMsg');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');
    
    // Limpar mensagens anteriores
    loadingMsg.classList.remove('show');
    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');
    
    // Validar vencimento
    if (!dataVencimento.value) {
        errorMsg.textContent = '❌ Por favor, selecione um dia de vencimento.';
        errorMsg.classList.add('show');
        return;
    }
    
    // Mostrar mensagem de carregamento
    loadingMsg.classList.add('show');
    submitBtn.disabled = true;
    
    try {
        const formData = new FormData(this);
        const dados = Object.fromEntries(formData);
        
        // Adiciona adicionais selecionados
        const adicionais = [];
        if (document.getElementById('telefoniaFixa').checked) {
            adicionais.push(document.getElementById('telefoniaFixa').value);
        }
        if (document.getElementById('wifiPlus').checked) {
            adicionais.push(document.getElementById('wifiPlus').value);
        }
        dados.adicionais = adicionais.length > 0 ? adicionais.join(' + ') : 'Nenhum';
        
        dados.dataEnvio = new Date().toLocaleString('pt-BR');
        
        // Enviar para planilha
        await enviarParaPlanilha(dados);
        
        // Sucesso
        loadingMsg.classList.remove('show');
        successMsg.classList.add('show');
        this.reset();
        
        // Remove seleção de dias
        document.querySelectorAll('.day-button').forEach(btn => {
            btn.classList.remove('selected');
        });
        dataVencimento.value = '';
        
        setTimeout(() => {
            successMsg.classList.remove('show');
            submitBtn.disabled = false;
        }, 3000);
        
    } catch (erro) {
        loadingMsg.classList.remove('show');
        errorMsg.textContent = '❌ Erro ao enviar indicação. Tente novamente.';
        errorMsg.classList.add('show');
        submitBtn.disabled = false;
    }
});

// Log para verificar se o formulário está funcionando
console.log('✅ Formulário de Indicações JR Telecom ativado');
console.log('📊 URL do Apps Script:', SCRIPT_URL);
console.log('💾 Dados sendo enviados para Google Sheets e salvos localmente como backup');
</script>

</body>
</html>
